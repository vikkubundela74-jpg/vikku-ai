<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vikku AI</title>
<style>
body {
  background: #050510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
h1 { color: #00ffc3; }
.box {
  max-width: 450px;
  margin: auto;
  padding: 20px;
  background: #11112a;
  border-radius: 15px;
}
input {
  width: 90%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  margin: 10px 0;
}
button {
  padding: 12px 25px;
  background: #00ffc3;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}
#reply {
  margin-top: 20px;
  color: #00ffc3;
}
</style>
</head>
<body>
<div class="box">
<h1>VIKKU AI</h1>
<p>Your Personal AI Assistant</p>
<input id="question" placeholder="कुछ भी पूछो...">
<br>
<button onclick="askAI()">Send</button>
<div id="reply">Welcome to Vikku AI!</div>
</div><script>
function askAI() {
  let q = document.getElementById("question").value.trim();
  let reply = document.getElementById("reply");

  if (q === "") {
    reply.innerText = "पहले कुछ लिखो!";
  } else {
    reply.innerText = "तुमने पूछा: " + q +
      "\nनमस्ते! मैं Vikku AI हूँ। अभी मेरा AI इंटरनेट से कनेक्ट नहीं है।";
  }
}
</script></body>
</html>
